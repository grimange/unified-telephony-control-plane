        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Quality guard tools
        run: scripts/ci/install-quality-tools

      - name: Setup Docker Buildx
        # release: docker/setup-buildx-action v4.2.0
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Validate C0 kernel boundaries
        run: make control-plane-config-check

      - name: Run C0 guard mutation tests
        run: make control-plane-config-check-test

      - name: Prove C0 migrations
        run: make control-plane-migrate-proof

      - name: Run C0 focused tests
        run: make control-plane-test

      - name: Run C0 proof harness
