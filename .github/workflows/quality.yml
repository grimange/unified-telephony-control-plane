          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Create K0 cluster
        run: make k3d-create

      - name: Deploy K1 application base
        run: make k8s-apply

      - name: Apply K2 Gateway edge
        run: make gateway-apply

      - name: Apply K3 security boundaries
        run: make security-apply

      - name: Apply K4 observability foundation
        run: make observability-apply

      - name: Prove K4 observability foundation
        run: make observability-proof

      - name: Prove K4 observability persistence
        run: make observability-persistence-proof

      - name: Prove K3 security boundaries after K4
