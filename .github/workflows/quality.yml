        # release: actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Quality guard tools
        run: scripts/ci/install-quality-tools

      - name: Install pinned Kubernetes tools
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="$(scripts/ci/install-kubernetes-tools)"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate K4 manifests
        run: make observability-config-check

  observability-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        # release: actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install pinned Kubernetes tools
        shell: bash
        run: |
