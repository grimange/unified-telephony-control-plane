log_format utcp_web_json escape=json
    '{"timestamp":"$time_iso8601",'
    '"request_id":"$http_x_request_id",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"service":"utcp",'
    '"component":"web"}';

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    access_log /dev/stdout utcp_web_json;
    error_log /dev/stderr warn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
