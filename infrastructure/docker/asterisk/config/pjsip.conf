[global]
type=global
endpoint_identifier_order=anonymous

[transport-udp-internal]
type=transport
protocol=udp
bind=0.0.0.0:5060

[anonymous]
type=endpoint
transport=transport-udp-internal
context=from-kamailio
direct_media=no
disallow=all
allow=ulaw
; Reclaim dialogs that lose external RTP without operator cleanup.
rtp_timeout=30
rtp_timeout_hold=30

[kamailio-edge]
type=endpoint
transport=transport-udp-internal
context=from-kamailio
disallow=all
allow=ulaw
aors=kamailio-edge
direct_media=no

[kamailio-edge]
type=aor
contact=sip:kamailio-sip-internal.utcp-platform.svc.cluster.local:5060
