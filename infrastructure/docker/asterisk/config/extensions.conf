[general]
static = yes
writeprotect = yes

[default]

[utcp-outbound]
exten => _.,1,NoOp(UTCP canonical outbound destination=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@kamailio-edge,30,b(utcp-outbound-predial^s^1))
 same => n,Hangup()

[utcp-outbound-predial]
exten => s,1,Set(PJSIP_HEADER(add,X-UTCP-Call-Leg-ID)=${UTCP_CALL_LEG_ID})
 same => n,Set(PJSIP_HEADER(add,X-UTCP-Route-Decision-ID)=${UTCP_ROUTE_DECISION_ID})
 same => n,Set(PJSIP_HEADER(add,X-UTCP-Trunk-Endpoint-ID)=${UTCP_TRUNK_ENDPOINT_ID})
 same => n,Set(PJSIP_HEADER(add,X-UTCP-Caller-Identity-ID)=${UTCP_CALLER_IDENTITY_ID})
 same => n,Return()

[utcp-conference-proof]
exten => participant,1,NoOp(UTCP conference proof participant)
 same => n,Answer()
 same => n,Stasis(utcp-t0-observation)
 same => n,Hangup()

[from-kamailio]
exten => _[c]o[n]f-.,1,NoOp(UTCP canonical conference admission destination=${EXTEN})
 same => n,Answer()
 same => n,Stasis(utcp-t0-observation,${EXTEN})
 same => n,Hangup()

exten => _utcp-in-.,1,NoOp(UTCP canonical inbound admission destination=${EXTEN})
 same => n,ExecIf($["${EXTEN:8}" !~ "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-5][0-9A-Fa-f]{3}-[89AaBb][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"]?Hangup(21))
 same => n,Set(__UTCP_INGRESS_EXTERNAL_TRUNK_ID=${PJSIP_HEADER(read,X-UTCP-Ingress-External-Trunk-ID)})
 same => n,Set(__UTCP_INGRESS_TELEPHONY_ADDRESS_ID=${PJSIP_HEADER(read,X-UTCP-Ingress-Telephony-Address-ID)})
 same => n,Set(__UTCP_INGRESS_TRUNK_ENDPOINT_ID=${PJSIP_HEADER(read,X-UTCP-Ingress-Trunk-Endpoint-ID)})
 same => n,Set(__UTCP_INGRESS_RUNTIME_NODE_ID=${PJSIP_HEADER(read,X-UTCP-Ingress-Runtime-Node-ID)})
 same => n,Answer()
 same => n,Stasis(utcp-t0-observation,${EXTEN},${UTCP_INGRESS_EXTERNAL_TRUNK_ID},${UTCP_INGRESS_TELEPHONY_ADDRESS_ID},${UTCP_INGRESS_TRUNK_ENDPOINT_ID},${UTCP_INGRESS_RUNTIME_NODE_ID})
 same => n,Hangup()

exten => _.,1,NoOp(UTCP internal application dialog rejected destination=${EXTEN})
 same => n,Hangup(21)

#tryinclude "extensions.local.conf"
