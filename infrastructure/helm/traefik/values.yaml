image:
  repository: traefik
  tag: v3.7.7
  pullPolicy: IfNotPresent

deployment:
  kind: Deployment
  replicas: 1

providers:
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false
    publishedService:
      enabled: false
  kubernetesGateway:
    enabled: true
    experimentalChannel: false
    namespaces:
      - traefik-system
      - utcp-platform

gateway:
  enabled: false

gatewayClass:
  enabled: false

ingressClass:
  enabled: false
  isDefaultClass: false

api:
  dashboard: false
  insecure: false
  debug: false

ingressRoute:
  dashboard:
    enabled: false
  healthcheck:
    enabled: false

log:
  format: json
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        X-Request-Id: keep
    queryParameters:
      defaultMode: drop

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true
    service:
      enabled: true
      labels:
        app.kubernetes.io/part-of: utcp

ports:
  traefik:
    expose:
      default: false
  metrics:
    port: 9100
    expose:
      default: false
    protocol: TCP
  web:
    port: 80
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP

service:
  enabled: true
  single: true
  spec:
    type: LoadBalancer

hostNetwork: false

rbac:
  enabled: true
  namespaced: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

persistence:
  enabled: false
