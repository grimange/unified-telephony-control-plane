apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-gateway-service-clusterip
  namespace: traefik-system
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __DNS_SERVICE_CIDR__
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: __GATEWAY_SERVICE_CIDR__
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-service-clusterips
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      utcp.io/network-role: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __DNS_SERVICE_CIDR__
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: __WEB_SERVICE_CIDR__
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: __API_SERVICE_CIDR__
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-data-service-clusterips
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchExpressions:
      - key: utcp.io/network-role
        operator: In
        values:
          - api
          - worker
          - scheduler
          - migration
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __DNS_SERVICE_CIDR__
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: __POSTGRES_SERVICE_CIDR__
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: __REDIS_SERVICE_CIDR__
      ports:
        - protocol: TCP
          port: 6379
