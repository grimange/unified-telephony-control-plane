apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-kubernetes-api
  namespace: traefik-system
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __KUBERNETES_API_CIDR__
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: __KUBERNETES_API_ENDPOINT_CIDR__
      ports:
        - protocol: TCP
          port: __KUBERNETES_API_ENDPOINT_PORT__
