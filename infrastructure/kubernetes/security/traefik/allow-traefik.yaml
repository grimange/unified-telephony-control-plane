apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-required-traffic
  namespace: traefik-system
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              utcp.io/network-role: gateway
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              utcp.io/network-role: kamailio-signaling
      ports:
        - protocol: TCP
          port: 8080
