apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kamailio-signaling-required-traffic
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      utcp.io/network-role: kamailio-signaling
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/component: asterisk-ari
              utcp.io/network-role: asterisk-ari
      ports:
        - protocol: UDP
          port: 5060
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/component: freeswitch
              utcp.io/network-role: freeswitch-sip
              utcp.dev/runtime-node: local-freeswitch-esl
      ports:
        - protocol: UDP
          port: 5060
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-data
          podSelector:
            matchLabels:
              utcp.io/network-role: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/component: rtpengine
      ports:
        - protocol: UDP
          port: 2223
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/component: asterisk-ari
              utcp.io/network-role: asterisk-ari
      ports:
        - protocol: UDP
          port: 5060
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-runtime
          podSelector:
            matchLabels:
              app.kubernetes.io/component: freeswitch
              utcp.io/network-role: freeswitch-sip
              utcp.dev/runtime-node: local-freeswitch-esl
      ports:
        - protocol: UDP
          port: 5060
