apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kamailio-registration-observer-required-egress
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      utcp.io/network-role: kamailio-registration-observer
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-data
          podSelector:
            matchLabels:
              utcp.io/network-role: postgres
      ports:
        - protocol: TCP
          port: 5432
