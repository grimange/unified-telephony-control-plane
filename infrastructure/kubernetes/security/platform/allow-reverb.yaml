apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-reverb-required-traffic
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      utcp.io/network-role: reverb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              utcp.io/network-role: gateway
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              utcp.io/network-role: api
        - podSelector:
            matchLabels:
              utcp.io/network-role: worker
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-data
          podSelector:
            matchLabels:
              utcp.io/network-role: redis
      ports:
        - protocol: TCP
          port: 6379
