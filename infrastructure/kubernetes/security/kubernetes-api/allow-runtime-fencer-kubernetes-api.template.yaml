apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-fencer-kubernetes-api
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k3-security
spec:
  podSelector:
    matchLabels:
      utcp.io/kubernetes-api-client: "true"
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __KUBERNETES_API_ENDPOINT_CIDR__
      ports:
        - protocol: TCP
          port: __KUBERNETES_API_ENDPOINT_PORT__
