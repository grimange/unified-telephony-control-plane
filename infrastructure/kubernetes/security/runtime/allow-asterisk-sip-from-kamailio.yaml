apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-asterisk-sip-from-kamailio
  namespace: utcp-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: asterisk-ari
      utcp.io/network-role: asterisk-ari
      utcp.dev/runtime-node: local-asterisk-ari
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              utcp.io/network-role: kamailio-signaling
      ports:
        - protocol: UDP
          port: 5060
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/component: kamailio
              utcp.io/network-role: kamailio-signaling
      ports:
        - protocol: UDP
          port: 5060
