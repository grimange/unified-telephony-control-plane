apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-asterisk-sip-from-kamailio
  namespace: utcp-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: asterisk-ari
      utcp.io/network-role: asterisk-ari
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              utcp.io/network-role: kamailio-signaling
      ports:
        - protocol: UDP
          port: 5060
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/component: rtpengine
              utcp.io/network-role: rtpengine-media
      ports:
        - protocol: UDP
          port: 10000
          endPort: 20000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/component: kamailio
              utcp.io/network-role: kamailio-signaling
      ports:
        - protocol: UDP
          port: 5062
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: utcp-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/component: rtpengine
              utcp.io/network-role: rtpengine-media
      ports:
        - protocol: UDP
          port: 40000
          endPort: 40099
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
