apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: utcp-application
  namespace: utcp-observability
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: observability
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - utcp-platform
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: gateway
  endpoints:
    - port: metrics
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
