apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: utcp-platform-alerts
  namespace: utcp-observability
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: observability
    release: kube-prometheus-stack
spec:
  groups:
    - name: utcp.platform
      rules:
        - alert: UTCPDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="utcp-platform",deployment=~"api|gateway|web|worker|scheduler"} < 1
          for: 2m
          labels:
            severity: critical
            component: platform
            namespace: utcp-platform
          annotations:
            summary: Required UTCP deployment is unavailable.
        - alert: UTCPRuntimeEngineWorkerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="utcp-platform",deployment=~"control-plane-outbox-dispatcher|telephony-command-worker|telephony-event-normalizer|telephony-reconciler"} < 1
          for: 2m
          labels:
            severity: critical
            component: runtime-engine
            namespace: utcp-platform
          annotations:
            summary: Required UTCP runtime-engine process role is unavailable.
        - alert: UTCPSimulatorEventSourceUnavailable
          expr: kube_deployment_status_replicas_available{namespace="utcp-platform",deployment="simulator-event-source"} < 1
          for: 2m
          labels:
            severity: critical
            component: simulator
            namespace: utcp-platform
          annotations:
            summary: The deterministic simulator event-source process role is unavailable.
        - alert: UTCPSimulatorScheduledEventBacklogGrowing
          expr: sum(simulator_scheduled_events{result=~"pending|retry_scheduled",due="due"}) > 20
          for: 10m
          labels:
            severity: warning
            component: simulator
            namespace: utcp-platform
          annotations:
            summary: Deterministic simulator due scheduled-event backlog is growing.
        - alert: UTCPSimulatorTerminalFailures
          expr: sum(simulator_operations_total{result="terminal_failed",failure_class!="none"}) > 2 and sum(simulator_reconciliation_total{result!="unsupported"}) > 0
          for: 10m
          labels:
            severity: warning
            component: simulator
            namespace: utcp-platform
          annotations:
            summary: Deterministic simulator terminal failures are repeating while simulator reconciliation is active.
        - alert: UTCPSimulatorReconciliationStuck
          expr: sum(simulator_reconciliation_total{result=~"operation_required|retry_scheduled|blocked"}) > 0 and sum(increase(simulator_event_publish_total{result="published"}[10m])) == 0
          for: 15m
          labels:
            severity: warning
            component: simulator
            namespace: utcp-platform
          annotations:
            summary: Deterministic simulator reconciliation appears stuck without event publication progress.
        - alert: UTCPTelephonyConferenceReconciliationStuck
          expr: sum(conference_reconciliation_total{result=~"operation_required|retry_scheduled|waiting|blocked"}) > 0 and sum(increase(conference_operations_total{result="succeeded"}[15m])) == 0
          for: 15m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference reconciliation appears stuck without successful operation progress.
        - alert: UTCPTelephonyParticipantReconciliationStuck
          expr: sum(conference_participant_reconciliation_total{result=~"operation_required|retry_scheduled|waiting|blocked"}) > 0 and sum(increase(conference_participant_operations_total{result="succeeded"}[15m])) == 0
          for: 15m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference participant reconciliation appears stuck without successful operation progress.
        - alert: UTCPTelephonyConferenceOperationTerminalFailure
          expr: sum(conference_operations_total{result="terminal_failed",failure_class!="none"}) > 0
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference runtime operation reached terminal failure.
        - alert: UTCPTelephonyParticipantOperationTerminalFailure
          expr: sum(conference_participant_operations_total{result="terminal_failed",failure_class!="none"}) > 0
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference participant runtime operation reached terminal failure.
        - alert: UTCPTelephonyConferenceRecoveryOperationFailures
          expr: sum(increase(utcp_conference_recovery_operation_failures_total[10m])) > 3
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference recovery operations are failing repeatedly.
        - alert: UTCPTelephonyConferenceRecoveryBacklogStale
          expr: sum(utcp_conference_recovery_backlog{result=~"operation_required|retry_scheduled|waiting|blocked"}) > 0 and max(utcp_conference_recovery_lag_seconds) > 300
          for: 15m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference recovery reconciliation backlog is older than the bounded recovery window.
        - alert: UTCPTelephonyConferenceRuntimeInspectionFailures
          expr: sum(utcp_conference_runtime_inspection_failures_10m) > 3
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference runtime inspection is failing repeatedly.
        - alert: UTCPConferencePendingNoCapacity
          expr: sum(utcp_conference_failover_pending{failover_state="pending_no_capacity"}) > 0
          for: 15m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference failover is waiting for replacement runtime capacity.
        - alert: UTCPRuntimeFenceTerminalFailure
          expr: sum(increase(utcp_runtime_resilience_operations_total{operation_type="runtime.node.runtime.fence",result="terminal_failed",failure_class!="none"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Runtime fencing reached terminal failure during recent resilience recovery.
        - alert: UTCPRuntimeRestoreTerminalFailure
          expr: sum(increase(utcp_runtime_resilience_operations_total{operation_type="runtime.node.restore",result="terminal_failed",failure_class!="none"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: RuntimeNode restoration reached terminal failure during recent resilience recovery.
        - alert: UTCPStaleActiveRuntimeBindings
          expr: sum(utcp_conference_stale_active_bindings) > 0
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Closed conferences still have active RuntimeBindings after the automatic retirement window.
        - alert: UTCPOrphanReclamationTerminalFailure
          expr: sum(increase(utcp_conference_orphan_reclamation_operations_total{result="terminal_failed",failure_class!="none"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Automatic orphan participant channel reclamation reached terminal failure during recent recovery.
            description: Automatic orphan participant-channel reclamation has reached a terminal failure according to the bounded orphan reclamation operation metric.
        - alert: UTCPAriReferenceFamilyDegraded
          expr: sum(utcp_conference_runtime_reference_health_10m{health="degraded_unavailable"}) > 3
          for: 10m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: ARI resource-family health is degrading authoritative runtime-reference inspection.
        - alert: UTCPConferenceRecoveryMetricEventPruneBacklog
          expr: utcp_conference_recovery_metric_event_prune_eligible_backlog > 10000
          for: 30m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Conference recovery metric-event retention pruning is falling behind.
            description: Automatic retention pruning for conference recovery diagnostic metric events is falling behind and will retry on the next hourly schedule.
        - alert: UTCPTelephonyExpiredActiveSessions
          expr: telephony_sessions_expired_active{status="active"} > 0
          for: 5m
          labels:
            severity: warning
            component: telephony-domain
            namespace: utcp-platform
          annotations:
            summary: Active telephony sessions have expired timestamps.
        - alert: UTCPAsteriskAriEventsUnavailable
          expr: sum(asterisk_ari_nodes{desired_state=~"active|draining"}) > 0 and kube_deployment_status_replicas_available{namespace="utcp-platform",deployment="asterisk-ari-events"} < 1
          for: 2m
          labels:
            severity: critical
            component: asterisk-ari
            namespace: utcp-platform
          annotations:
            summary: Asterisk ARI event listener is unavailable while Asterisk nodes are active.
        - alert: UTCPAsteriskAriNodeWithoutListenerEvidence
          expr: sum(asterisk_ari_nodes{desired_state=~"active|draining"}) > 0 and sum(asterisk_ari_listener_nodes{result="claimed"}) == 0
          for: 10m
          labels:
            severity: warning
            component: asterisk-ari
            namespace: utcp-platform
          annotations:
            summary: Active Asterisk ARI nodes have no recent listener ownership evidence.
        - alert: UTCPAsteriskAriEventStreamDegraded
          expr: sum(asterisk_ari_events_degraded_nodes) > 0
          for: 5m
          labels:
            severity: warning
            component: asterisk-ari
            namespace: utcp-platform
          annotations:
            summary: Automatic Asterisk ARI event-stream recovery remains degraded.
            description: One or more Asterisk ARI RuntimeNodes remain events-degraded after automatic event-stream reconnect recovery attempts.
        - alert: UTCPAsteriskAriAuthenticationFailures
          expr: increase(asterisk_ari_authentication_failures_total{failure_class="authentication_failed"}[10m]) > 2
          for: 5m
          labels:
            severity: warning
            component: asterisk-ari
            namespace: utcp-platform
          annotations:
            summary: Asterisk ARI authentication failures are repeating.
        - alert: UTCPAsteriskAriReconnectLoop
          expr: sum(increase(asterisk_ari_reconnects_total[10m])) > 5
          for: 5m
          labels:
            severity: warning
            component: asterisk-ari
            namespace: utcp-platform
          annotations:
            summary: Asterisk ARI listener is reconnecting repeatedly.
        - alert: UTCPAsteriskAriReceiptBacklog
          expr: sum(asterisk_ari_events_received_total{result=~"pending|retry_scheduled"}) > 20
          for: 10m
          labels:
            severity: warning
            component: asterisk-ari
            namespace: utcp-platform
          annotations:
            summary: Asterisk ARI raw event receipt backlog is growing.
        - alert: UTCPAsteriskRuntimeObservationStale
          expr: sum(asterisk_ari_nodes{desired_state=~"active|draining",observed_state=~"stale|unavailable|degraded"}) > 0
          for: 15m
          labels:
            severity: warning
            component: asterisk-ari
            namespace: utcp-platform
          annotations:
            summary: Asterisk ARI runtime observations are stale or unavailable.
        - alert: UTCPKamailioRegistrationObserverUnavailable
          expr: kube_deployment_status_replicas_available{namespace="utcp-platform",deployment="kamailio-registration-observer"} < 1
          for: 2m
          labels:
            severity: critical
            component: kamailio-registration-observer
            namespace: utcp-platform
          annotations:
            summary: Kamailio registration observer Deployment has no available replicas.
        - alert: UTCPKamailioRegistrationObserverMissingLease
          expr: kube_deployment_status_replicas_available{namespace="utcp-platform",deployment="kamailio-registration-observer"} >= 1 and kamailio_registration_observer_active == 0
          for: 5m
          labels:
            severity: warning
            component: kamailio-registration-observer
            namespace: utcp-platform
          annotations:
            summary: Kamailio registration observer Deployment is ready but holds no active listener lease.
        - alert: UTCPKamailioRegistrationCheckpointStale
          expr: kamailio_registration_observer_lag_seconds > 120
          for: 5m
          labels:
            severity: warning
            component: kamailio-registration-observer
            namespace: utcp-platform
          annotations:
            summary: Kamailio registration observer checkpoint has not advanced recently.
        - alert: UTCPKamailioRegistrationRepeatedPollFailure
          expr: increase(kamailio_registration_snapshot_poll_failures_total[10m]) > 3
          for: 5m
          labels:
            severity: warning
            component: kamailio-registration-observer
            namespace: utcp-platform
          annotations:
            summary: Kamailio registration observer usrloc snapshot polls are repeatedly failing.
        - alert: UTCPKamailioRegistrationProjectionBacklog
          expr: kamailio_registration_projection_backlog > 20
          for: 10m
          labels:
            severity: warning
            component: kamailio-registration-observer
            namespace: utcp-platform
          annotations:
            summary: Kamailio registration event receipt backlog is growing.
        - alert: UTCPStatefulSetUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="utcp-data",statefulset=~"postgres|redis"} < 1
          for: 2m
          labels:
            severity: critical
            component: data
            namespace: utcp-data
          annotations:
            summary: Required UTCP data StatefulSet is unavailable.
        - alert: UTCPContainerRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"utcp-platform|utcp-data|traefik-system|utcp-observability"}[15m]) > 2
          for: 5m
          labels:
            severity: warning
            component: kubernetes
            namespace: "{{ $labels.namespace }}"
          annotations:
            summary: A UTCP container restarted repeatedly.
        - alert: UTCPMigrationJobFailed
          expr: kube_job_status_failed{namespace="utcp-platform",job_name=~"migrate.*"} > 0
          for: 1m
          labels:
            severity: critical
            component: migration
            namespace: utcp-platform
          annotations:
            summary: The UTCP migration Job failed.
        - alert: UTCPPvcPending
          expr: kube_persistentvolumeclaim_status_phase{namespace=~"utcp-data|utcp-observability",phase="Pending"} > 0
          for: 2m
          labels:
            severity: warning
            component: storage
            namespace: "{{ $labels.namespace }}"
          annotations:
            summary: A UTCP PVC is pending.
        - alert: UTCPTargetDown
          expr: up{namespace=~"utcp-observability|traefik-system"} == 0
          for: 2m
          labels:
            severity: warning
            component: observability
            namespace: "{{ $labels.namespace }}"
          annotations:
            summary: An expected observability target is down.
        - alert: UTCPTraefikUnavailable
          expr: kube_deployment_status_replicas_available{namespace="traefik-system",deployment="traefik"} < 1
          for: 2m
          labels:
            severity: critical
            component: traefik
            namespace: traefik-system
          annotations:
            summary: Traefik is unavailable.
        - alert: UTCPPrometheusUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="utcp-observability",statefulset=~"prometheus-.*"} < 1
          for: 2m
          labels:
            severity: critical
            component: prometheus
            namespace: utcp-observability
          annotations:
            summary: Prometheus is unavailable.
        - alert: UTCPLokiUnavailable
          expr: kube_statefulset_status_replicas_ready{namespace="utcp-observability",statefulset=~"loki.*"} < 1
          for: 2m
          labels:
            severity: critical
            component: loki
            namespace: utcp-observability
          annotations:
            summary: Loki is unavailable.
        - alert: UTCPAlloyUnavailable
          expr: kube_deployment_status_replicas_available{namespace="utcp-observability",deployment=~".*alloy.*"} < 1
          for: 2m
          labels:
            severity: critical
            component: alloy
            namespace: utcp-observability
          annotations:
            summary: Alloy log collection is unavailable.
