apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-observability-kubernetes-api-egress
  namespace: utcp-observability
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k4-observability
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - prometheus
          - grafana
          - alloy
          - kube-state-metrics
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __KUBERNETES_API_ENDPOINT_CIDR__
      ports:
        - protocol: TCP
          port: __KUBERNETES_API_ENDPOINT_PORT__
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-operator-apiserver-egress
  namespace: utcp-observability
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp-k4-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: __KUBERNETES_API_ENDPOINT_CIDR__
      ports:
        - protocol: TCP
          port: __KUBERNETES_API_ENDPOINT_PORT__
