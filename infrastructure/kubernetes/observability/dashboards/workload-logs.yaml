apiVersion: v1
kind: ConfigMap
metadata:
  name: utcp-workload-logs-dashboard
  namespace: utcp-observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: observability
data:
  utcp-workload-logs.json: |
    {
      "uid": "utcp-workload-logs",
      "title": "UTCP Workload Logs",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "tags": ["utcp", "logs"],
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "type": "logs",
          "title": "API, Worker, Scheduler, Gateway, Web, Data, and Traefik Logs",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 16},
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "Loki"},
              "expr": "{namespace=~\"utcp-platform|utcp-data|traefik-system\",container=~\"api|worker|scheduler|gateway|web|postgres|redis|traefik\"}"
            }
          ]
        }
      ]
    }
