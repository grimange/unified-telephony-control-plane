apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sip-wss
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: kamailio
spec:
  parentRefs:
    - name: utcp-local
      namespace: traefik-system
      sectionName: websecure
  hostnames:
    - sip.utcp.local.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /ws
      backendRefs:
        - name: kamailio
          port: 8080
