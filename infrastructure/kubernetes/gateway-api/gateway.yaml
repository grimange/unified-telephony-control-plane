apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: utcp-local
  namespace: traefik-system
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: gateway-api
spec:
  gatewayClassName: utcp-traefik
  listeners:
    - name: web
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              utcp.io/gateway-access: enabled
    - name: websecure
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: utcp-local-gateway-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              utcp.io/gateway-access: enabled
