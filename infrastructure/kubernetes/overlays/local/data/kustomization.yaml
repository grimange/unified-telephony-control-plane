apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: utcp-local-data-credentials
    namespace: utcp-data
    envs:
      - local-data-credentials.properties
resources:
  - ../../../base/data
images:
  - name: postgres
    newName: postgres
    newTag: 17.6-alpine
  - name: redis
    newName: redis
    newTag: 8.2.3-alpine
