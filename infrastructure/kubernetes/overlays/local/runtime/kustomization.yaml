apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: utcp-local-asterisk-ari-credentials
    namespace: utcp-runtime
    envs:
      - local-asterisk-ari-credentials.properties
resources:
  - ../../../components/asterisk-sip-fixtures
  - ../../../base/runtime
images:
  - name: utcp-asterisk-ari
    newName: utcp-local-registry:5000/utcp/asterisk-ari
    newTag: 0.1.0-k1-dev
