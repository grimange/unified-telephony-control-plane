apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: utcp-local-asterisk-ari-credentials
    namespace: utcp-runtime
    envs:
      - local-asterisk-ari-credentials.properties
configMapGenerator:
  - name: asterisk-local-sip-fixtures
    namespace: utcp-runtime
    files:
      - extensions.local.conf
resources:
  - ../../../base/runtime
images:
  - name: utcp-asterisk-ari
    newName: utcp-local-registry:5000/utcp/asterisk-ari
    newTag: 0.1.0-k1-dev
