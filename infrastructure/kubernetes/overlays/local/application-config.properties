APP_NAME=Unified Telephony Control Plane API
APP_ENV=local
APP_DEBUG=false
APP_URL=https://app.utcp.local.test
LOG_CHANNEL=stderr
LOG_LEVEL=info
UTCP_SERVICE_NAME=utcp-api
UTCP_APP_VERSION=0.1.0-dev
UTCP_BUILD_COMMIT=unknown
UTCP_BUILD_TIMESTAMP=unknown
UTCP_MANAGED_ASTERISK_IMAGE=utcp-local-registry:5000/utcp/asterisk-ari:0.1.0-k1-dev
UTCP_READINESS_REQUIRED_DEPENDENCIES=postgres,redis
DB_CONNECTION=pgsql
DB_HOST=postgres.utcp-data.svc.cluster.local
DB_PORT=5432
DB_DATABASE=utcp
DB_USERNAME=utcp
DB_CHARSET=utf8
DB_SSLMODE=disable
REDIS_CLIENT=phpredis
REDIS_HOST=redis.utcp-data.svc.cluster.local
REDIS_PORT=6379
REDIS_PASSWORD=
CACHE_STORE=redis
QUEUE_CONNECTION=redis
SESSION_DRIVER=redis
SESSION_SECURE_COOKIE=true
SESSION_HTTP_ONLY=true
SESSION_SAME_SITE=lax
BROADCAST_CONNECTION=reverb
REVERB_SERVER_HOST=0.0.0.0
REVERB_SERVER_PORT=8080
REVERB_HOST=reverb.utcp-platform.svc.cluster.local
REVERB_PORT=8080
REVERB_SCHEME=http
REVERB_SCALING_ENABLED=true
REVERB_ALLOWED_ORIGIN=app.utcp.local.test
FILESYSTEM_DISK=local
MAIL_MAILER=log
