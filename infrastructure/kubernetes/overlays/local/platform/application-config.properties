APP_NAME=Unified Telephony Control Plane API
APP_ENV=local
APP_DEBUG=false
APP_URL=http://gateway:8080
LOG_CHANNEL=stderr
LOG_LEVEL=info
UTCP_SERVICE_NAME=utcp-api
UTCP_APP_VERSION=0.1.0-dev
UTCP_BUILD_COMMIT=unknown
UTCP_BUILD_TIMESTAMP=unknown
UTCP_READINESS_REQUIRED_DEPENDENCIES=postgres,redis
DB_CONNECTION=pgsql
DB_HOST=postgres.utcp-data.svc.cluster.local
DB_PORT=5432
DB_DATABASE=utcp
DB_USERNAME=utcp
DB_CHARSET=utf8
DB_SSLMODE=disable
REDIS_CLIENT=phpredis
REDIS_HOST=redis.utcp-data.svc.cluster.local
REDIS_PORT=6379
REDIS_PASSWORD=
CACHE_STORE=redis
QUEUE_CONNECTION=redis
SESSION_DRIVER=redis
SESSION_SECURE_COOKIE=true
SESSION_HTTP_ONLY=true
SESSION_SAME_SITE=lax
UTCP_TELEPHONY_SESSION_LIFETIME_MINUTES=1
BROADCAST_CONNECTION=log
FILESYSTEM_DISK=local
MAIL_MAILER=log
