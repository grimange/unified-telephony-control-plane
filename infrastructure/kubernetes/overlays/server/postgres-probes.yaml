apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: utcp-data
spec:
  template:
    spec:
      containers:
        - name: postgres
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 && psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'select 1' >/dev/null
            failureThreshold: 180
            periodSeconds: 2
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 && psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'select 1' >/dev/null
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 && psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'select 1' >/dev/null
            periodSeconds: 10
            timeoutSeconds: 3
