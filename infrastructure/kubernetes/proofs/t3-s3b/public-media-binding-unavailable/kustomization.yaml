apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../overlays/local-media-edge
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: rtpengine
      namespace: utcp-platform
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3d-utcp-local-agent-0
