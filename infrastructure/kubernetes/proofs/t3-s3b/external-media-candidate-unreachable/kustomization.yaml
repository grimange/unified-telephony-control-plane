apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../overlays/local-media-edge
patches:
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: allow-rtpengine-external-media
      namespace: utcp-platform
    patch: |-
      - op: add
        path: /spec/ingress/0/from
        value:
          - podSelector:
              matchLabels:
                utcp.dev/t3-s3b-proof-only: unreachable
