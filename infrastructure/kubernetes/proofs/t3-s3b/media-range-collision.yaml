apiVersion: v1
kind: Service
metadata:
  name: t3-s3b-nodeport-collision
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    utcp.dev/proof-only: t3-s3b
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: t3-s3b-proof-only
  ports:
    - name: media-range-lower-bound
      protocol: UDP
      port: 40000
      targetPort: 40000
      nodePort: 40000
    - name: media-range-upper-bound
      protocol: UDP
      port: 40099
      targetPort: 40099
      nodePort: 40099
