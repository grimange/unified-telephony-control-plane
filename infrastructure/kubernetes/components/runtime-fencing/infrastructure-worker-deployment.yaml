apiVersion: apps/v1
kind: Deployment
metadata:
  name: utcp-runtime-fence-worker
  namespace: utcp-platform
  labels:
    app.kubernetes.io/name: utcp
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: runtime-fence-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: utcp
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: runtime-fence-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: utcp
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: runtime-fence-worker
        utcp.io/network-role: worker
        utcp.io/kubernetes-api-client: "true"
    spec:
      serviceAccountName: utcp-runtime-fencer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime-fence-worker
          image: utcp-api:local
          imagePullPolicy: IfNotPresent
          args: ["telephony-infrastructure-worker"]
          env:
            - name: BROADCAST_CONNECTION
              value: log
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: utcp-application-config
            - secretRef:
                name: utcp-local-data-credentials
          volumeMounts:
            - name: kubernetes-api-credentials
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kubernetes-api-credentials
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
                      mode: 0444
