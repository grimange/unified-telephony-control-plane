apiVersion: batch/v1
kind: Job
metadata:
  name: utcp-migrate
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: migration
        utcp.io/network-role: migration
    spec:
      restartPolicy: Never
      serviceAccountName: utcp-platform-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: utcp-api
          imagePullPolicy: Always
          args:
            - migrate
          envFrom:
            - configMapRef:
                name: utcp-application-config
            - secretRef:
                name: utcp-local-data-credentials
            - secretRef:
                name: utcp-local-kamailio-db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
