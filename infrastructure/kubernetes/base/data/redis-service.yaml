apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: utcp-data
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
