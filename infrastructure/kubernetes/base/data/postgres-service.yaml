apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: utcp-data
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
