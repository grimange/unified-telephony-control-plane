apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: utcp-kubernetes-maintenance
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: utcp-kubernetes-maintenance
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/managed-by: utcp
subjects:
  - kind: ServiceAccount
    name: utcp-kubernetes-maintenance
    namespace: utcp-platform
roleRef:
  kind: ClusterRole
  name: utcp-kubernetes-maintenance
  apiGroup: rbac.authorization.k8s.io
