apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: utcp-infrastructure-reader
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: utcp-infrastructure-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: utcp-infrastructure-reader
subjects:
  - kind: ServiceAccount
    name: utcp-api
    namespace: utcp-platform
