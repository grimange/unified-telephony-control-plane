apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: api
        utcp.io/network-role: api
    spec:
      serviceAccountName: utcp-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: utcp-api
          imagePullPolicy: Always
          args:
            - api
          ports:
            - name: php-fpm
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: utcp-application-config
            - secretRef:
                name: utcp-local-data-credentials
            - secretRef:
                name: utcp-local-reverb-credentials
          startupProbe:
            tcpSocket:
              port: php-fpm
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: php-fpm
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: php-fpm
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
