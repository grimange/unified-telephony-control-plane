apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamailio
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: kamailio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: kamailio
  template:
    metadata:
      annotations:
        utcp.io/kamailio-config-sha256: 749fc1ca8a22750531621b259d523ef045e5214e2f997683655bf22731673e7d
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: kamailio
        utcp.io/network-role: kamailio-signaling
    spec:
      serviceAccountName: utcp-platform-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kamailio
          image: utcp-kamailio
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              sed \
                -e "s#__KAMAILIO_AUTH_DB_USER__#${KAMAILIO_AUTH_DB_USER}#g" \
                -e "s#__KAMAILIO_AUTH_DB_PASSWORD__#${KAMAILIO_AUTH_DB_PASSWORD}#g" \
                -e "s#__KAMAILIO_USRLOC_DB_USER__#${KAMAILIO_USRLOC_DB_USER}#g" \
                -e "s#__KAMAILIO_USRLOC_DB_PASSWORD__#${KAMAILIO_USRLOC_DB_PASSWORD}#g" \
                /etc/kamailio/kamailio.cfg > /tmp/kamailio.cfg
              exec kamailio -DD -E -f /tmp/kamailio.cfg -P /tmp/kamailio.pid
          ports:
            - name: ws
              containerPort: 8080
              protocol: TCP
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
          envFrom:
            - secretRef:
                name: utcp-local-kamailio-db-credentials
          volumeMounts:
            - name: kamailio-config
              mountPath: /etc/kamailio/kamailio.cfg
              subPath: kamailio.cfg
              readOnly: true
          startupProbe:
            tcpSocket:
              port: ws
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: kamailio-config
          configMap:
            name: kamailio-config
