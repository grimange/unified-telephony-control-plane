apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamailio-registration-observer
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: kamailio-registration-observer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: kamailio-registration-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: kamailio-registration-observer
        utcp.io/network-role: kamailio-registration-observer
    spec:
      serviceAccountName: utcp-platform-app
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kamailio-registration-observer
          image: utcp-api
          imagePullPolicy: Always
          args:
            - kamailio-registration-observer
          env:
            - name: BROADCAST_CONNECTION
              value: log
          envFrom:
            - configMapRef:
                name: utcp-application-config
            - secretRef:
                name: utcp-local-data-credentials
            - secretRef:
                name: utcp-local-kamailio-db-credentials
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - php
                - artisan
                - about
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - php
                - artisan
                - about
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
