apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-outbox-dispatcher
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: control-plane-outbox-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: control-plane-outbox-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: control-plane-outbox-dispatcher
        utcp.io/network-role: worker
    spec:
      serviceAccountName: utcp-platform-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: outbox-dispatcher
          image: utcp-api
          imagePullPolicy: Always
          args:
            - control-plane-outbox-dispatcher
          envFrom:
            - configMapRef:
                name: utcp-application-config
            - secretRef:
                name: utcp-local-data-credentials
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
