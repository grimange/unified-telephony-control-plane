apiVersion: v1
kind: ConfigMap
metadata:
  name: kamailio-config
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: kamailio
data:
  kamailio.cfg: |
    #!KAMAILIO
    #!define FLT_MEDIA_RELAY_REQUIRED 10
    # Stable provider identity is the native-k3s default source configuration;
    # registration/NAT rendering removes this bounded provider anchor block.

    debug=2
    log_stderror=yes
    log_facility=LOG_LOCAL0
    memdbg=5
    memlog=5
    children=2
    auto_aliases=no
    tcp_accept_no_cl=yes
    tcp_connection_lifetime=130
    tcp_max_connections=512
    max_while_loops=100
    listen=tcp:0.0.0.0:8080 advertise sip.utcp.local.test:443
    listen=tcp:0.0.0.0:8090
    # UDP/5060 is provider-facing; UDP/5062 is the trusted runtime ingress.
    listen=udp:0.0.0.0:5060 advertise kamailio-sip-external.utcp-platform.svc.cluster.local:5060 name "provider"
    listen=udp:0.0.0.0:5062 advertise kamailio-sip-internal.utcp-platform.svc.cluster.local:5060 name "runtime"
    alias=sip.utcp.local.test

    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "dialog.so"
    loadmodule "rr.so"
    loadmodule "siputils.so"
    loadmodule "pv.so"
    loadmodule "xlog.so"
    loadmodule "textops.so"
    loadmodule "maxfwd.so"
    loadmodule "sanity.so"
    loadmodule "xhttp.so"
    loadmodule "websocket.so"
    loadmodule "auth.so"
    loadmodule "auth_db.so"
    loadmodule "usrloc.so"
    loadmodule "registrar.so"
    loadmodule "db_postgres.so"
    loadmodule "sqlops.so"
    loadmodule "nathelper.so"
    loadmodule "rtpengine.so"
    loadmodule "pike.so"
    loadmodule "uac.so"
    loadmodule "jsonrpcs.so"

    modparam("auth_db", "db_url", "postgres://__KAMAILIO_AUTH_DB_USER__:__KAMAILIO_AUTH_DB_PASSWORD__@postgres.utcp-data.svc.cluster.local:5432/utcp")
    modparam("auth_db", "user_column", "username")
    modparam("auth_db", "domain_column", "domain")
    modparam("auth_db", "password_column", "ha1")
    modparam("auth_db", "password_column_2", "ha1")
    modparam("auth_db", "calculate_ha1", 0)
    modparam("auth_db", "use_domain", 1)
    modparam("auth_db", "load_credentials", "")

    modparam("dialog", "track_cseq_updates", 1)

    modparam("sqlops", "sqlcon", "conference=>postgres://__KAMAILIO_AUTH_DB_USER__:__KAMAILIO_AUTH_DB_PASSWORD__@postgres.utcp-data.svc.cluster.local:5432/utcp")

    # uac_reg is a provider executor only. Its datasource is sanitized and
    # contains HA1, never an application plaintext secret.
    modparam("uac", "reg_db_url", "postgres://__KAMAILIO_REGISTRATION_DB_USER__:__KAMAILIO_REGISTRATION_DB_PASSWORD__@postgres.utcp-data.svc.cluster.local:5432/utcp")
    modparam("uac", "reg_db_table", "kamailio_external_trunk_registration_view")
    modparam("uac", "reg_contact_addr", "kamailio-sip-internal.utcp-platform.svc.cluster.local:5060")
    modparam("uac", "default_socket", "udp:0.0.0.0:5060")
    modparam("uac", "reg_timer_interval", 10)
    modparam("uac", "reg_retry_interval", 60)
    modparam("uac", "reg_random_delay", 5)
    modparam("uac", "reg_keep_callid", 1)
    modparam("uac", "reg_use_domain", 1)
    modparam("uac", "auth_username_avp", "$avp(auser)")
    modparam("uac", "auth_password_avp", "$avp(apass)")
    modparam("uac", "auth_realm_avp", "$avp(arealm)")
    modparam("jsonrpcs", "transport", 1)

    modparam("usrloc", "db_url", "postgres://__KAMAILIO_USRLOC_DB_USER__:__KAMAILIO_USRLOC_DB_PASSWORD__@postgres.utcp-data.svc.cluster.local:5432/utcp")
    modparam("usrloc", "db_mode", 1)
    modparam("usrloc", "use_domain", 1)
    modparam("usrloc", "timer_interval", 20)

    modparam("registrar", "default_expires", 120)
    modparam("registrar", "min_expires", 10)
    modparam("registrar", "max_expires", 120)
    modparam("registrar", "max_contacts", 1)
    modparam("registrar", "method_filtering", 1)

    modparam("rr", "enable_full_lr", 1)

    modparam("rtpengine", "rtpengine_sock", "udp:rtpengine.utcp-platform.svc.cluster.local:2223")

    request_route {
        xlog("L_INFO", "kamailio_synthetic_request_received method=$rm ruri=$ru call_id=$ci source_ip=$si receive_port=$Rp\n");
        if (!mf_process_maxfwd_header("10")) {
            sl_send_reply("483", "Too Many Hops");
            exit;
        }

        if (!sanity_check("17895", "7")) {
            xlog("L_WARN", "kamailio_registration_rejected result=sanity\n");
            sl_send_reply("400", "Bad Request");
            exit;
        }

        if ($rm == "OPTIONS") {
            if ($Rp == 5060 && $rd == "external.utcp.local.test") {
                route(EXTERNAL_TRUNK_ROUTE);
                exit;
            }
            sl_send_reply("200", "Keepalive");
            exit;
        }

        if ($rm == "INVITE" && $Rp == 5060 && $rd == "external.utcp.local.test") {
            route(EXTERNAL_TRUNK_ROUTE);
            exit;
        }

        if ($rm == "CANCEL") {
            route(MEDIA_DELETE);
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }

        if (has_totag()) {
            route(WITHINDLG);
            exit;
        }

        # The receive socket, not a peer-controlled URI, is the trust boundary.
        if ($Rp == 5062) {
            if ($rm == "INVITE") {
                if ($hdr(X-UTCP-Call-Leg-ID) == "" || $hdr(X-UTCP-Route-Decision-ID) == "" || $hdr(X-UTCP-Trunk-Endpoint-ID) == "") {
                    xlog("L_WARN", "kamailio_runtime_external_route result=missing_canonical_correlation call_id=$ci\n");
                    sl_send_reply("403", "Missing UTCP Execution Correlation");
                    exit;
                }
                route(RUNTIME_EXTERNAL_TRUNK);
                exit;
            }
        }

        if ($rd != "sip.utcp.local.test") {
            xlog("L_WARN", "kamailio_registration_rejected result=initial_foreign_domain\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }

        if ($rm == "REGISTER") {
            if (!www_authorize("$fd", "kamailio_signaling_auth_view")) {
                xlog("L_INFO", "kamailio_registration_challenge result=challenge\n");
                www_challenge("$fd", "0");
                exit;
            }

            if ($au != $fU) {
                xlog("L_WARN", "kamailio_registration_rejected result=auth_identity_mismatch\n");
                sl_send_reply("403", "Forbidden");
                exit;
            }

            if (!save("location", "0x04")) {
                xlog("L_WARN", "kamailio_registration_rejected result=save_failed\n");
                sl_reply_error();
                exit;
            }

            xlog("L_INFO", "kamailio_registration_accepted result=ok\n");
            exit;
        }

        if (is_method("INVITE|ACK|CANCEL|BYE|UPDATE")) {
            route(APPLICATION_DIALOG);
            exit;
        }

        xlog("L_WARN", "kamailio_registration_rejected result=unsupported_method method=$rm\n");
        sl_send_reply("405", "Method Not Allowed");
        exit;
    }

    route[APPLICATION_DIALOG] {
        if ($rm == "ACK") {
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }

        if ($rm != "INVITE") {
            sl_send_reply("405", "Method Not Allowed");
            exit;
        }

        if (!www_authorize("$fd", "kamailio_signaling_auth_view")) {
            xlog("L_INFO", "kamailio_application_dialog_challenge result=challenge method=$rm call_id=$ci\n");
            www_challenge("$fd", "0");
            exit;
        }

        if ($au != $fU) {
            xlog("L_WARN", "kamailio_application_dialog_rejected result=auth_identity_mismatch call_id=$ci\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }

        consume_credentials();

        if ($proto == "ws" || $proto == "wss") {
            if (!add_contact_alias()) {
                xlog("L_WARN", "kamailio_application_dialog_rejected result=websocket_contact_alias_failed method=$rm call_id=$ci\n");
                sl_send_reply("400", "Bad Request");
                exit;
            }
        }

        route(MEDIA_OFFER);
        record_route();
        if ($rU =~ "^conf-") {
            route(CONFERENCE_RUNTIME_RELAY);
        } else {
            route(APPLICATION_RUNTIME_RELAY);
        }
        exit;
    }

    route[CONFERENCE_RUNTIME_RELAY] {
        if (!($rU =~ "^conf-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$")) {
            xlog("L_INFO", "kamailio_conference_route result=invalid_admission_user method=$rm call_id=$ci\n");
            sl_send_reply("400", "Bad Request");
            exit;
        }

        if (!sql_query("conference", "select admission_user, signaling_identity, sip_target from kamailio_conference_route_view where admission_user = '$rU'", "conference_route")) {
            xlog("L_WARN", "kamailio_conference_route result=projection_query_failed method=$rm call_id=$ci\n");
            t_reply("503", "Conference Runtime Unavailable");
            exit;
        }

        if ($dbr(conference_route=>rows) != 1) {
            xlog("L_INFO", "kamailio_conference_route result=route_not_found method=$rm call_id=$ci\n");
            t_reply("404", "Conference Participant Not Found");
            exit;
        }

        if ($dbr(conference_route=>[0,1]) != $au) {
            xlog("L_WARN", "kamailio_conference_route result=auth_identity_mismatch method=$rm call_id=$ci\n");
            t_reply("403", "Forbidden");
            exit;
        }

        $du = $dbr(conference_route=>[0,2]);
        t_on_reply("APPLICATION_RUNTIME_MEDIA_REPLY");
        t_on_failure("APPLICATION_RUNTIME_UNAVAILABLE");
        if (!t_relay()) {
            xlog("L_WARN", "kamailio_conference_route result=runtime_unavailable method=$rm call_id=$ci\n");
            t_reply("503", "Conference Runtime Unavailable");
        }
        exit;
    }

    route[EXTERNAL_TRUNK_ROUTE] {
        # Peer-supplied correlation is never trusted. The only accepted
        # values are re-established from the T6 projection after identity
        # matching on source host and called address.
        remove_hf("X-UTCP-Call-Leg-ID");
        remove_hf("X-UTCP-Route-Decision-ID");
        remove_hf("X-UTCP-Trunk-Endpoint-ID");
        remove_hf("X-UTCP-Ingress-External-Trunk-ID");
        remove_hf("X-UTCP-Ingress-Telephony-Address-ID");
        remove_hf("X-UTCP-Ingress-Trunk-Endpoint-ID");
        remove_hf("X-UTCP-Ingress-Runtime-Node-ID");

        if (!sql_query("conference", "select tenant_id, canonical_external_trunk_id, telephony_address_id, trunk_endpoint_id from kamailio_external_trunk_route_view where destination_user = '$rU' and direction = 'inbound' and provider_host = '$si'", "external_trunk_route")) {
            xlog("L_WARN", "kamailio_external_trunk_route result=projection_query_failed method=$rm call_id=$ci\n");
            sl_send_reply("503", "External Trunk Projection Unavailable");
            exit;
        }

        if ($dbr(external_trunk_route=>rows) == 0) {
            xlog("L_INFO", "kamailio_external_trunk_route result=unknown_ingress_identity method=$rm call_id=$ci\n");
            sl_send_reply("404", "External Trunk Route Not Found");
            exit;
        }
        if ($dbr(external_trunk_route=>rows) != 1) {
            xlog("L_WARN", "kamailio_external_trunk_route result=ambiguous_ingress_identity method=$rm call_id=$ci\n");
            sl_send_reply("403", "Ambiguous External Trunk Route");
            exit;
        }

        if ($rm == "OPTIONS") {
            xlog("L_INFO", "kamailio_external_trunk_route result=matched method=OPTIONS call_id=$ci\n");
            sl_send_reply("200", "External Trunk Route Matched");
            exit;
        }

        if (!sql_query("conference", "select runtime_node_id, sip_target from kamailio_inbound_runtime_target_view where tenant_id = '$dbr(external_trunk_route=>[0,0])' order by placement_priority, runtime_node_id", "inbound_runtime_target")) {
            xlog("L_WARN", "kamailio_external_trunk_route result=execution_target_projection_failed method=$rm call_id=$ci\n");
            sl_send_reply("503", "Inbound Runtime Unavailable");
            exit;
        }
        if ($dbr(inbound_runtime_target=>rows) < 1) {
            xlog("L_WARN", "kamailio_external_trunk_route result=no_eligible_runtime_target method=$rm call_id=$ci\n");
            sl_send_reply("503", "Inbound Runtime Unavailable");
            exit;
        }

        append_hf("X-UTCP-Ingress-External-Trunk-ID: $dbr(external_trunk_route=>[0,1])\r\n");
        append_hf("X-UTCP-Ingress-Telephony-Address-ID: $dbr(external_trunk_route=>[0,2])\r\n");
        append_hf("X-UTCP-Ingress-Trunk-Endpoint-ID: $dbr(external_trunk_route=>[0,3])\r\n");
        append_hf("X-UTCP-Ingress-Runtime-Node-ID: $dbr(inbound_runtime_target=>[0,0])\r\n");
        $var(utcp_ingress_address_id) = $dbr(external_trunk_route=>[0,2]);
        $rU = "utcp-in-" + $var(utcp_ingress_address_id);
        $du = $dbr(inbound_runtime_target=>[0,1]);
        route(MEDIA_OFFER);
        record_route();
        t_on_reply("APPLICATION_RUNTIME_MEDIA_REPLY");
        t_on_failure("APPLICATION_RUNTIME_UNAVAILABLE");
        if (!t_relay()) {
            xlog("L_WARN", "kamailio_external_trunk_route result=relay_failed method=$rm call_id=$ci\n");
            sl_reply_error();
        }
        exit;
    }

    route[RUNTIME_EXTERNAL_TRUNK] {
        if ($hdr(X-UTCP-Call-Leg-ID) == "" || $hdr(X-UTCP-Route-Decision-ID) == "") {
            xlog("L_WARN", "kamailio_runtime_external_route result=missing_canonical_correlation call_id=$ci\n");
            sl_send_reply("403", "Missing UTCP Execution Correlation");
            exit;
        }

        if (!sql_query("conference", "select endpoint_uri, regexp_replace(endpoint_uri, '^sip:', '') as provider_host, r.auth_username, r.auth_ha1, r.realm from kamailio_external_trunk_route_view v left join kamailio_external_trunk_registration_view r on r.trunk_endpoint_id = v.trunk_endpoint_id where v.trunk_endpoint_id = '$hdr(X-UTCP-Trunk-Endpoint-ID)' and v.destination_user = '$rU' and v.direction = 'outbound' and v.desired_state = 'active' and v.accept_new_calls = true", "runtime_external_route")) {
            xlog("L_WARN", "kamailio_runtime_external_route result=projection_query_failed call_id=$ci\n");
            sl_send_reply("503", "External Trunk Projection Unavailable");
            exit;
        }

        if ($dbr(runtime_external_route=>rows) != 1) {
            xlog("L_WARN", "kamailio_runtime_external_route result=endpoint_not_selected_or_projected endpoint_id=$hdr(X-UTCP-Trunk-Endpoint-ID) call_id=$ci\n");
            sl_send_reply("404", "Selected External Trunk Endpoint Not Found");
            exit;
        }

        $du = $dbr(runtime_external_route=>[0,0]);
        $var(utcp_destination_user) = $rU;
        $var(utcp_provider_host) = $dbr(runtime_external_route=>[0,1]);
        $ru = "sip:" + $var(utcp_destination_user) + "@" + $var(utcp_provider_host);
        $avp(auser) = $dbr(runtime_external_route=>[0,2]);
        $avp(apass) = $dbr(runtime_external_route=>[0,3]);
        $avp(arealm) = $dbr(runtime_external_route=>[0,4]);
        $fsn = "provider";
        remove_hf("X-UTCP-Call-Leg-ID");
        remove_hf("X-UTCP-Route-Decision-ID");
        remove_hf("X-UTCP-Trunk-Endpoint-ID");
        dlg_manage();
        # UTCP_PROVIDER_RECORD_ROUTE_BEGIN
        record_route();
        # UTCP_PROVIDER_RECORD_ROUTE_END
        t_on_failure("RUNTIME_EXTERNAL_TRUNK_AUTH");
        if (!t_relay()) {
            xlog("L_WARN", "kamailio_runtime_external_route result=relay_failed endpoint_id=$hdr(X-UTCP-Trunk-Endpoint-ID) call_id=$ci\n");
            sl_reply_error();
        }
        exit;
    }

    route[WITHINDLG] {
        if (loose_route()) {
            if ($du == "") {
                if ($(ru{uri.param,alias}) != "") {
                    if (!handle_ruri_alias()) {
                        xlog("L_WARN", "kamailio_application_dialog_rejected result=invalid_dialog_contact_alias method=$rm call_id=$ci\n");
                        sl_send_reply("400", "Bad Request");
                        exit;
                    }

                    if ($du == "") {
                        xlog("L_WARN", "kamailio_application_dialog_rejected result=invalid_dialog_contact_alias method=$rm call_id=$ci\n");
                        sl_send_reply("400", "Bad Request");
                        exit;
                    }
                } else if ($(ru{uri.param,transport}) == "ws" || $(ru{uri.param,transport}) == "wss" || $(ru{uri.host}) =~ "\\.invalid$") {
                    xlog("L_WARN", "kamailio_application_dialog_rejected result=missing_dialog_contact_alias method=$rm call_id=$ci\n");
                    sl_send_reply("400", "Bad Request");
                    exit;
                }
            }

            if ($rm == "BYE") {
                route(MEDIA_DELETE);
            }

            if (is_method("INVITE|UPDATE")) {
                route(MEDIA_OFFER);
                t_on_reply("APPLICATION_RUNTIME_MEDIA_REPLY");
            }

            if (!t_relay()) {
                xlog("L_WARN", "kamailio_application_dialog_relay_failed route=within_dialog method=$rm call_id=$ci\n");
                sl_reply_error();
            }
            exit;
        }

        # Registration/NAT providers may send an in-dialog BYE without a
        # Route header.  Keep loose_route() as the first authority, then use
        # the existing provider-source projection only as a trust predicate.
        # dlg_set_ruri() resolves the upstream request to the managed runtime
        # leg; this fallback never selects a target from registration state.
        if ($Rp == 5060 && $rm == "BYE" && has_totag() && is_known_dlg()) {
            if (sql_query("conference", "select provider_host from kamailio_external_trunk_route_view where provider_host = '$si' and direction = 'outbound' and desired_state = 'active' limit 1", "provider_dialog_source")) {
                if ($dbr(provider_dialog_source=>rows) > 0) {
                    if (dlg_set_ruri()) {
                        dlg_manage();
                        route(MEDIA_DELETE);
                        if (!t_relay()) {
                            sl_reply_error();
                        }
                        exit;
                    }
                    xlog("L_WARN", "WITHINDLG known provider dialog has no runtime target callid=$ci source=$si\n");
                }
            } else {
                xlog("L_WARN", "WITHINDLG provider source trust query failed callid=$ci source=$si\n");
            }
        }

        if ($rm == "ACK") {
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }

        sl_send_reply("404", "Not Found");
        exit;
    }

    route[APPLICATION_RUNTIME_RELAY] {
        $du = "sip:application-runtime-sip.utcp-runtime.svc.cluster.local:5060;transport=udp";
        t_on_reply("APPLICATION_RUNTIME_MEDIA_REPLY");
        t_on_failure("APPLICATION_RUNTIME_UNAVAILABLE");

        if (!t_relay()) {
            xlog("L_WARN", "kamailio_application_dialog_rejected result=application_runtime_unavailable method=$rm call_id=$ci\n");
            t_reply("503", "Application Runtime Unavailable");
            exit;
        }

        exit;
    }

    route[MEDIA_OFFER] {
        if (!has_body("application/sdp")) {
            return;
        }

        if ($(ru{uri.param,alias}) != "" || $(ru{uri.param,transport}) == "ws" || $(ru{uri.param,transport}) == "wss" || $(ru{uri.host}) =~ "\\.invalid$") {
            if (!rtpengine_offer("replace-origin replace-session-connection ICE=force RTP/SAVPF DTLS=passive rtcp-mux-offer direction=runtime direction=browser")) {
                xlog("L_WARN", "kamailio_application_dialog_media result=media_offer_failed method=$rm call_id=$ci\n");
                sl_send_reply("488", "Media Relay Unavailable");
                exit;
            }
        } else {
            if (!rtpengine_offer("replace-origin replace-session-connection ICE=remove RTP/AVP rtcp-mux-demux direction=browser direction=runtime")) {
                xlog("L_WARN", "kamailio_application_dialog_media result=media_offer_failed method=$rm call_id=$ci\n");
                sl_send_reply("488", "Media Relay Unavailable");
                exit;
            }
        }

        setflag(FLT_MEDIA_RELAY_REQUIRED);
        xlog("L_INFO", "kamailio_application_dialog_media result=media_offer method=$rm call_id=$ci\n");
    }

    route[MEDIA_ANSWER] {
        if (!has_body("application/sdp")) {
            return;
        }

        if ($proto == "ws" || $proto == "wss") {
            if (!rtpengine_answer("replace-origin replace-session-connection ICE=remove RTP/AVP rtcp-mux-demux direction=browser direction=runtime")) {
                xlog("L_WARN", "kamailio_application_dialog_media result=media_answer_failed method=$rm call_id=$ci\n");
                drop();
            }
        } else {
            if (!rtpengine_answer("replace-origin replace-session-connection ICE=force RTP/SAVPF DTLS=passive rtcp-mux-offer direction=runtime direction=browser")) {
                xlog("L_WARN", "kamailio_application_dialog_media result=media_answer_failed method=$rm call_id=$ci\n");
                drop();
            }
        }

        xlog("L_INFO", "kamailio_application_dialog_media result=media_answer method=$rm call_id=$ci\n");
    }

    route[MEDIA_DELETE] {
        if (!rtpengine_delete()) {
            xlog("L_WARN", "kamailio_application_dialog_media result=media_delete_failed method=$rm call_id=$ci\n");
            return;
        }

        xlog("L_INFO", "kamailio_application_dialog_media result=media_delete method=$rm call_id=$ci\n");
    }

    failure_route[APPLICATION_RUNTIME_UNAVAILABLE] {
        if (t_is_canceled()) {
            route(MEDIA_DELETE);
            exit;
        }

        route(MEDIA_DELETE);

        if (t_check_status("408")) {
            xlog("L_WARN", "kamailio_application_dialog_rejected result=application_runtime_unavailable method=$rm call_id=$ci\n");
            t_reply("503", "Application Runtime Unavailable");
            exit;
        }
    }

    failure_route[RUNTIME_EXTERNAL_TRUNK_AUTH] {
        if (t_is_canceled()) {
            exit;
        }
        if (t_check_status("401|407")) {
            if (uac_auth("1")) {
                t_relay();
            } else {
                xlog("L_WARN", "kamailio_runtime_external_route result=provider_auth_failed call_id=$ci\n");
            }
            exit;
        }
    }

    onreply_route[APPLICATION_RUNTIME_MEDIA_REPLY] {
        route(MEDIA_ANSWER);
    }

    event_route[xhttp:request] {
        if ($Rp == 8090) {
            if ($hu == "/rpc") {
                jsonrpc_dispatch();
                exit;
            }
            xhttp_reply("404", "Not Found", "text/plain", "not found\n");
            exit;
        }
        if ($hu == "/healthz") {
            xhttp_reply("200", "OK", "text/plain", "ok\n");
            exit;
        }

        if ($hu != "/ws") {
            xhttp_reply("404", "Not Found", "text/plain", "not found\n");
            exit;
        }

        if ($hdr(Upgrade) != "websocket") {
            xhttp_reply("426", "Upgrade Required", "text/plain", "websocket required\n");
            exit;
        }

        if (!($hdr(Sec-WebSocket-Protocol) =~ "sip")) {
            xhttp_reply("400", "Bad Request", "text/plain", "sip subprotocol required\n");
            exit;
        }

        if ($hdr(Origin) != "https://app.utcp.local.test" && $hdr(Origin) != "https://sip.utcp.local.test") {
            xlog("L_WARN", "kamailio_websocket_rejected result=origin\n");
            xhttp_reply("403", "Forbidden", "text/plain", "forbidden\n");
            exit;
        }

        if (ws_handle_handshake()) {
            xlog("L_INFO", "kamailio_websocket_accepted result=ok\n");
            exit;
        }

        xhttp_reply("500", "Internal Server Error", "text/plain", "handshake failed\n");
    }
