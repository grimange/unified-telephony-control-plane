apiVersion: v1
kind: Service
metadata:
  name: reverb
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: reverb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: reverb
  ports:
    - name: ws
      port: 8080
      targetPort: ws
      protocol: TCP
