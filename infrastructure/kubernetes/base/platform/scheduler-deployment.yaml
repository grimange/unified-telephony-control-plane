apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: scheduler
        utcp.io/network-role: scheduler
        utcp.io/kubernetes-api-client: "true"
    spec:
      serviceAccountName: utcp-kubernetes-observer
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: utcp-api
          imagePullPolicy: Always
          args:
            - scheduler
          env:
            - name: BROADCAST_CONNECTION
              value: log
          envFrom:
            - configMapRef:
                name: utcp-application-config
            - secretRef:
                name: utcp-local-data-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
