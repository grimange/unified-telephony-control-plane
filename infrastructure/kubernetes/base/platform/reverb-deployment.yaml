apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverb
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: reverb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: reverb
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: reverb
        utcp.io/network-role: reverb
    spec:
      serviceAccountName: utcp-platform-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reverb
          image: utcp-api
          imagePullPolicy: Always
          args:
            - reverb
          ports:
            - name: ws
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: utcp-application-config
            - secretRef:
                name: utcp-local-data-credentials
            - secretRef:
                name: utcp-local-reverb-credentials
          startupProbe:
            tcpSocket:
              port: ws
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
