apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtpengine
  namespace: utcp-platform
  labels:
    app.kubernetes.io/part-of: utcp
    app.kubernetes.io/component: rtpengine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/part-of: utcp
      app.kubernetes.io/component: rtpengine
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: utcp
        app.kubernetes.io/component: rtpengine
        utcp.io/network-role: rtpengine-media
    spec:
      serviceAccountName: utcp-platform-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rtpengine
          image: utcp-rtpengine
          imagePullPolicy: Always
          ports:
            - name: ng
              containerPort: 2223
              protocol: UDP
            - name: media
              containerPort: 40000
              protocol: UDP
            - name: metrics
              containerPort: 2224
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: rtpengine-config
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/utcp-rtpengine-ng-ping
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/utcp-rtpengine-ng-ping
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run/rtpengine
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}
